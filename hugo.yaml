baseURL: "https://ecce.me/"
locale: en-US
title: ecce

disableKinds: [taxonomy, term]
permalinks:
  page:
    projects: /:slug/
outputs:
  home: [HTML, RSS]
  page: [HTML]
  section: [HTML, RSS]

pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true

menus:
  main:
    - identifier: about
      name: About
      url: /about/
      weight: 1
    - identifier: projects
      name: Projects
      url: /#projects
      weight: 2

params:
  description: "A personal builder site for coursework, projects, and practical systems."
  favicon: /images/ecce-logo.png
  hero:
    intro: "Hi, I'm"
    title: Logan
  font:
    fontSize: 1rem
    fontWeight: 400
    lineHeight: 1.5
    textAlign: left
  color:
    textColor: "#1a1b1e"
    secondaryTextColor: "#5a5f6b"
    textLinkColor: "#007a1e"
    backgroundColor: "#f2f4f2"
    secondaryBackgroundColor: "#e6f0e8"
    primaryColor: "#007a1e"
    secondaryColor: "#edf3ee"
    darkmode:
      textColor: "#e4e6eb"
      secondaryTextColor: "#b0b3b8"
      textLinkColor: "#00FF41"
      backgroundColor: "#18191a"
      secondaryBackgroundColor: "#212529"
      primaryColor: "#00FF41"
      secondaryColor: "#212529"
