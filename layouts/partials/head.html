<link rel="stylesheet" href="{{ "css/header.css" | relURL }}" media="all">
<link rel="stylesheet" href="{{ "css/custom.css" | relURL }}">

<style>
    :root {
        --text-color: {{ .Site.Params.color.textColor | default "#343a40" }};
        --text-secondary-color: {{ .Site.Params.color.secondaryTextColor | default "#6c757d" }};
        --text-link-color: {{ .Site.Params.color.textLinkColor | default (.Site.Params.color.primaryColor | default "#007bff") }};
        --background-color: {{ .Site.Params.color.backgroundColor | default "#eaedf0" }};
        --secondary-background-color: {{ .Site.Params.color.secondaryBackgroundColor | default "#64ffda1a" }};
        --primary-color: {{ .Site.Params.color.primaryColor | default "#007bff" }};
        --secondary-color: {{ .Site.Params.color.secondaryColor | default "#f8f9fa" }};

        color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --text-color: {{ .Site.Params.color.darkmode.textColor | default "#e4e6eb" }};
        --text-secondary-color: {{ .Site.Params.color.darkmode.secondaryTextColor | default "#b0b3b8" }};
        --text-link-color: {{ .Site.Params.color.darkmode.textLinkColor | default (.Site.Params.color.darkmode.primaryColor | default "#ffffff") }};
        --background-color: {{ .Site.Params.color.darkmode.backgroundColor | default "#18191a" }};
        --secondary-background-color: {{ .Site.Params.color.darkmode.secondaryBackgroundColor | default "#212529" }};
        --primary-color: {{ .Site.Params.color.darkmode.primaryColor | default "#ffffff" }};
        --secondary-color: {{ .Site.Params.color.darkmode.secondaryColor | default "#212529" }};
      }
    }

    body {
        color: var(--text-color);
        background-color: var(--background-color);
        font-size: {{ .Site.Params.font.fontSize | default "1rem" }};
        font-weight: {{ .Site.Params.font.fontWeight | default "400" }};
        line-height: {{ .Site.Params.font.lineHeight | default "1.5" }};
        text-align: {{ .Site.Params.font.textAlign | default "left" }};
    }

    html {
        background-color: var(--background-color) !important;
    }

    body::-webkit-scrollbar {
        height: 0px;
        width: 8px;
        background-color: var(--background-color);
    }

    ::-webkit-scrollbar-track {
        border-radius: 1rem;
    }

    ::-webkit-scrollbar-thumb {
        border-radius: 1rem;
        background: #b0b0b0;
        outline: 1px solid var(--background-color);
    }
</style>
