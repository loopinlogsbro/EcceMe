{{ with .Site.GetPage "/projects/ecce-me" }}
<section id="projects" class="project-spotlight page-width" aria-labelledby="featured-project-title">
    <div class="project-spotlight-panel">
        <div class="project-spotlight-copy">
            <p class="project-spotlight-label">Featured project</p>
            <h2 id="featured-project-title">{{ .Title }}</h2>
            <p class="project-spotlight-summary">{{ .Params.spotlight }}</p>
            <a href="{{ .RelPermalink }}" aria-label="Read more about ecce.me">Read more <span aria-hidden="true">→</span></a>
        </div>
        <div class="project-spotlight-art">
            <img src="{{ "images/ecce-homepage-droste.webp" | relURL }}" width="1440" height="1140"
                alt="The ecce.me homepage shown inside itself, repeating in smaller frames.">
        </div>
    </div>
</section>
{{ end }}
