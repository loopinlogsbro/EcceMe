<header id="profileHeader">
    <nav class="site-nav page-width" aria-label="Main">
        {{ if .IsHome }}
            <span class="site-greeting">{{ .Site.Params.hero.intro }}</span>
        {{ else }}
            <a class="site-home" href="{{ .Site.Home.RelPermalink }}" aria-label="Logan — Home">
                <svg viewBox="24 56 407 190" aria-hidden="true" focusable="false">
                    {{- partial "sections/signature-paths.html" . -}}
                </svg>
            </a>
        {{ end }}
        <ul class="site-nav-links">
            {{ range .Site.Menus.main }}
                <li>
                    <a href="{{ .URL }}">
                        {{- .Name -}}
                    </a>
                </li>
            {{ end }}
        </ul>
    </nav>
</header>
