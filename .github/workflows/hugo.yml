name: Hugo

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Hugo build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build and check public entry points
        run: ./scripts/build-site "$RUNNER_TEMP/ecce-public"
